name: Bug report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `or --version`
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / runtime
      description: OS + shell + Bun version if running from source
      placeholder: "Linux, zsh, Bun 1.3.14"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen
      placeholder: "Ran `or credits` and got..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact command(s) used. Redact any API keys.
      value: |
        1.
        2.
        3.
  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: Paste the CLI output here (redact secrets)
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Anything else?
      description: Context, related issues, possible fixes
